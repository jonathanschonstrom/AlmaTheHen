name: Import verified BirdAI source

on:
  push:
    paths:
      - '.bootstrap/**'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for complete payload
        id: ready
        shell: bash
        run: |
          if [[ -f .bootstrap/READY ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reconstruct verified source tree
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          cat .bootstrap/part-* | tr -d '\n' | base64 --decode > /tmp/alma-core-v057.tar.gz
          tar -xzf /tmp/alma-core-v057.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/import-source.yml
      - name: Commit imported source
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "Alma source importer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import verified BirdAI v0.5.7 Neural Control source"
          git push
