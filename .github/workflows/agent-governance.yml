name: BirdAI Governance

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
      - 'chore/**'

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Governance static checks
        run: python -m pytest -q tests/test_governance_static.py
      - name: Neural control static regression
        run: python -m pytest -q tests/test_neural_control_static.py
